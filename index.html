<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="/tend/">
  <title>Tend</title>
  <meta name="description" content="A tiny, joyful habit and weight tracker.">
  <meta name="theme-color" content="#fbf8f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <main id="page">
    <header class="top">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title"></h1>
      </div>
      <button class="icon-btn" id="more" aria-label="Tracker options"></button>
    </header>

    <div class="day" id="day">
      <button class="icon-btn sm" id="prev" aria-label="Previous day"></button>
      <span id="dayLabel">Today</span>
      <button class="icon-btn sm" id="next" aria-label="Next day"></button>
    </div>

    <section class="entry" id="entry"></section>

    <section class="chart-wrap">
      <div class="readout" id="readout"><div class="rv" id="rv"></div><div class="rd" id="rd"></div></div>
      <svg id="chart" role="img" aria-label="History chart"></svg>
      <div class="ranges" id="ranges"></div>
    </section>
  </main>

  <nav class="tabs" id="tabs" aria-label="Trackers"></nav>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
